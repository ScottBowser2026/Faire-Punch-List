name: Daily Summary Email

on:
  schedule:
    # 7:45 AM Eastern all year: 11:45 UTC in summer (EDT), 12:45 UTC in winter (EST).
    # The script only sends between 7 and 11 AM Eastern and once per day, so the
    # run that lands at 6:45 or 8:45 Eastern does nothing.
    - cron: '45 11 * * *'
    - cron: '45 12 * * *'
  workflow_dispatch:
    inputs:
      test_recipient:
        description: "Test: a name from the team list (e.g. Scott Bowser). Only they get messages — their own list plus the all-jobs list. Leave blank to send to everyone now."
        required: false
        default: ''

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install firebase-admin
        run: npm install firebase-admin@12 @firebase/app
      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Send morning job lists
        env:
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          TEAMS_WORKFLOW_URL: ${{ secrets.TEAMS_WORKFLOW_URL }}
          TEST_RECIPIENT: ${{ github.event.inputs.test_recipient }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: node scripts/send-daily-summary.js
