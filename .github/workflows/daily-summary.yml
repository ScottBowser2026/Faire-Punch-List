name: Daily Summary Email

on:
  schedule:
    # 13:00 UTC = 8:00 AM Eastern (EST, winter). Switch to '0 12 * * *' once EDT (summer, UTC-4) is in effect.
    - cron: '0 13 * * *'
    # 21:30 UTC = 4:30 PM Eastern (EST, winter). Switch to '30 20 * * *' once EDT (summer, UTC-4) is in effect.
    - cron: '30 21 * * *'
  workflow_dispatch: {}

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install firebase-admin
        run: npm install firebase-admin @firebase/app
      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Send daily summary email
        env:
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: node scripts/send-daily-summary.js
