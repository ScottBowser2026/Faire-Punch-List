name: Deploy Hosting

on:
  push:
    branches: [main]
    paths-ignore:
      - 'functions/**'
      - 'scripts/**'
      - '.github/workflows/deploy-functions.yml'
      - '.github/workflows/daily-summary.yml'
      - 'README.md'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Debug - list hosting sites in project
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: firebase hosting:sites:list --project faire-food-qc --json 2>&1 | tee /tmp/sites.json

      - name: Deploy to Firebase Hosting (faire-punch-list site, faire-food-qc project)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: firebase deploy --only hosting --project faire-food-qc --non-interactive --force --debug 2>&1 | tee /tmp/deploy.log

      - name: Debug - list local public dir contents
        run: |
          echo "::notice title=Public Dir Listing::$(ls -la . | tr '\n' ' ')"

      - name: Debug - surface output as annotations
        if: always()
        run: |
          echo "::notice title=Sites List::$(tail -c 3000 /tmp/sites.json | tr '\n' ' ')"
          echo "::notice title=Deploy File Count::$(grep -i 'files in\|found.*files\|uploading\|new file\|beginning deploy\|nothing to deploy\|up to date' /tmp/deploy.log | tr '\n' ' | ')"
          echo "::notice title=Deploy Grep Hosting URL::$(grep -i 'hosting url\|hosting:sites\|hosting:channel\|site:.*faire' /tmp/deploy.log | tail -c 2000 | tr '\n' ' ')"
          echo "::notice title=Deploy Errors::$(grep -i 'error\|fail\|cannot\|denied' /tmp/deploy.log | tail -c 2000 | tr '\n' ' ')"
