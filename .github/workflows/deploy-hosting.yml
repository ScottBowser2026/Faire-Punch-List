name: Deploy Hosting

on:
  push:
    branches: [main]
    paths-ignore:
      - 'functions/**'
      - 'scripts/**'
      - '.github/workflows/daily-summary.yml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: List hosting sites (diagnostic)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: firebase hosting:sites:list --project faire-builder-tracker --json > /tmp/sites.json 2>&1 || true

      - name: List public dir contents (diagnostic)
        run: find . -maxdepth 1 -not -path './.git*' > /tmp/public-dir-listing.txt 2>&1

      - name: Deploy hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
        run: firebase deploy --only hosting --project faire-builder-tracker --non-interactive --force --debug > /tmp/deploy-output.json 2>&1 || echo "DEPLOY_FAILED=1" >> $GITHUB_ENV

      - name: Save diagnostic output
        run: |
          mkdir -p .deploy-logs
          cp /tmp/sites.json .deploy-logs/last-sites.json || true
          cp /tmp/deploy-output.json .deploy-logs/last-deploy.json || true
          cp /tmp/public-dir-listing.txt .deploy-logs/last-public-dir-listing.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .deploy-logs
          git commit -m "chore: record hosting deploy diagnostic output [skip ci]" || echo "no changes to commit"
          git push

      - name: Fail job if deploy failed
        if: env.DEPLOY_FAILED == '1'
        run: exit 1
